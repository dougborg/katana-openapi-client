[project]
name = "katana-mcp-server"
version = "0.116.0"
description = "MCP server for Katana Manufacturing ERP"
authors = [
    {name = "Doug Borg", email = "dougborg@dougborg.org"},
]
maintainers = [
    {name = "Doug Borg", email = "dougborg@dougborg.org"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "katana",
  "manufacturing",
  "erp",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "claude",
  "ai-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.0",
    "katana-openapi-client>=0.82.0",
    "prefab-ui>=0.19",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "structlog>=25.5.0",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.0.0",
    # SQLAlchemy's async engine requires greenlet to bridge sync→async
    # context for the DB driver. Declared explicitly for the #342 typed
    # cache; without it, async session operations raise at runtime.
    "greenlet>=3.0.0",
    # ISO 4217 currency-aware money formatting (Prefab UI ``Total`` metrics).
    # Picks per-currency symbol, decimal digits, and separators so non-USD
    # orders render correctly (€1,500.00, ¥1500 with no decimals, etc.).
    "babel>=2.17",
]

# Note: Development dependencies like mcp-hmr require Python >=3.12
# Install manually for hot-reload development: uv pip install mcp-hmr
# See docs/mcp-server/DEVELOPMENT.md for setup instructions

[tool.uv.sources]
katana-openapi-client = { workspace = true }

[project.urls]
Homepage = "https://github.com/dougborg/katana-openapi-client"
Repository = "https://github.com/dougborg/katana-openapi-client"
Documentation = "https://dougborg.github.io/katana-openapi-client/"
"Bug Tracker" = "https://github.com/dougborg/katana-openapi-client/issues"

[project.scripts]
katana-mcp-server = "katana_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katana_mcp"]

# Pytest Configuration (Native TOML - pytest 9.0+)
[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests with mocks",
    "integration: Integration tests requiring API key",
    "browser: Browser-render tests via Playwright + fastmcp dev-apps (slow, needs `playwright install chromium`)",
    "cache_warmup_enabled: opt in to the lifespan cache-warmup task (default-off in tests via autouse fixture)",
]

# Versioning, changelog generation, and tagging are handled by release-please
# (see release-please-config.json and .release-please-manifest.json at the
# repo root) rather than python-semantic-release. See docs/RELEASE.md.
