  # --- rerank endpoints: equivalent nested component names ----------------
  # The local naming convention drops the upstream Dto suffix; the audit
  # compares these nested references by literal name.
  - endpoint: "POST /manufacturing_order_rerank"
    kind: type_diff
    field: place
    live: "$ref:RerankPlaceDto"
    local: "$ref:RerankPlace"
    category: intentional_local_divergence
    reason: >-
      Structurally identical to upstream's RerankPlaceDto; renamed to
      RerankPlace per our convention of dropping the `Dto` suffix. The audit
      compares nested $ref targets by name, so the rename reads as a type
      diff.

  - endpoint: "POST /sales_order_rerank"
    kind: type_diff
    field: place
    live: "$ref:RerankPlaceDto"
    local: "$ref:RerankPlace"
    category: intentional_local_divergence
    reason: >-
      Structurally identical to upstream's RerankPlaceDto; renamed to
      RerankPlace per our convention of dropping the `Dto` suffix. The audit
      compares nested $ref targets by name, so the rename reads as a type
      diff.

  # --- search filters: named component vs upstream's inline object ----------
  # Upstream declares each search request body inline, so its `filter` reads
  # as a bare `object`. We name the clause so the generators emit a usable
  # type instead of an untyped dict. Same fields either side — this is a
  # modelling choice, not drift. (These endpoints only became comparable at
  # all once the audit started reading inline request bodies, #1043.)
  - endpoint: "POST /sales_orders/search"
    kind: type_diff
    field: filter
    live: "object"
    local: "$ref:SalesOrderSearchFilter"
    category: intentional_local_divergence
    reason: >-
      Upstream inlines the request body, so `filter` renders as a bare
      `object`; we name the clause `SalesOrderSearchFilter` so the generated
      clients get a real type. Field sets match.

  - endpoint: "POST /sales_order_rows/search"
    kind: type_diff
    field: filter
    live: "object"
    local: "$ref:SalesOrderRowSearchFilter"
    category: intentional_local_divergence
    reason: >-
