# Spec-drift override registry
# =============================
#
# Canonical catalog of *known* divergences between our local spec
# (`docs/katana-openapi.yaml`) and Katana's live gateway spec
# (`docs/upstream-specs/live-gateway.yaml`).
#
# `poe audit-spec` matches each finding against the entries below. A matched
# finding is **suppressed** from the strict gate (it won't fail CI) and is
# re-surfaced under a category-specific report section. An *un*matched finding
# is new drift — it fails `audit-spec --strict`. An override that matches
# nothing is **stale** (the drift was resolved); the audit reports it so it
# can be removed.
#
# This file is two things at once:
#   1. A CI allowlist — so the gate guards against *new* drift, not the
#      backlog of known divergences.
#   2. A punch list — the `local_correct_upstream_wrong` and
#      `both_wrong_live_correct` entries are bugs in Katana's published spec
#      that we'd recommend they fix. Hand this list to the Katana team.
#
# Matching is intentionally **narrow**: an override pins the exact
# (endpoint, kind, field, values) of the finding it suppresses. If the spec
# changes shape — a different type, a different required set — the override
# stops matching, the finding resurfaces as new drift, and the stale override
# is reported. Suppression can never silently hide a *changed* divergence.
#
# Categories
# ----------
#   intentional_local_divergence
#       We deliberately differ. Usually local is strictly more precise than
#       upstream's loose typing (a typed `$ref`/enum where live says bare
#       `string`/`object`). Permanent. No upstream action.
#
#   local_correct_upstream_wrong          ← PUNCH LIST
#       Our spec matches the real wire contract; upstream's published spec is
#       wrong or under-documented. Permanent on our side; recommend Katana fix.
#
#   both_wrong_live_correct               ← PUNCH LIST
#       Both published specs (live-gateway + readme-portal) are wrong; only the
#       live API tells the truth. Recommend Katana fix both.
#
#   upstream_correct_local_wrong          ← TEMPORARY (requires fix_tracked_in)
#       Local is wrong; upstream is right. Allowlisted only so the gate can be
#       green today. MUST carry `fix_tracked_in:` and should be removed when the
#       tracked fix lands. Surfaces in the "pending local fixes" report section.
#
# Entry schema
# ------------
#   endpoint:        "<METHOD> <path>"     (e.g. "POST /sales_orders/search")
#   kind:            DTO drift — type_diff | only_live | only_local | required_diff
#                    query params (--params) — param_only_local | param_only_live |
#                      param_type_diff | param_enum_diff
#                    responses (--responses) — response_wrapper |
#                      response_empty_local | response_empty_both
#                    (see the param/response section near the end of this file)
#   field:           property name / wire param name / HTTP status code
#                    (omit for kind: required_diff)
#   live / local:    the exact type strings — pins the divergence so a *changed*
#                    type resurfaces (type_diff, param_type_diff, param_enum_diff;
#                    "wrapped"/"bare" for response_wrapper)
#   live_required /
#   local_required:  the exact required-key lists (kind: required_diff only)
#   category:        one of the four above
#   reason:          why this divergence exists / what we believe is true
#   fix_tracked_in:  issue ref (required iff category == upstream_correct_local_wrong)

overrides:
  # --- custom_field_definitions: typed enums vs upstream's bare `string` ----
  - endpoint: "POST /custom_field_definitions"
    kind: type_diff
    field: entity_type
    live: "string"
    local: "$ref:CustomFieldEntityType"
    category: intentional_local_divergence
    reason: >-
      We model entity_type as a typed enum ($ref:CustomFieldEntityType) for
      client ergonomics; the live gateway declares it as a bare `string`.
      Local is strictly more precise. (Enum-value accuracy is tracked
      separately under #805.)

  - endpoint: "POST /custom_field_definitions"
    kind: type_diff
    field: field_type
    live: "string"
    local: "$ref:CustomFieldType"
    category: intentional_local_divergence
    reason: >-
      Typed enum ($ref:CustomFieldType) vs upstream's bare `string`. Local is
      strictly more precise. (Enum-value accuracy tracked under #805.)

  - endpoint: "POST /custom_field_definitions"
    kind: type_diff
    field: options
    live: "object"
    local: "oneOf:[$ref:CustomFieldOptionsCreate]"
    category: intentional_local_divergence
    reason: >-
      Live declares `options` as a bare nullable `object` with no properties;
      locally it is a typed `anyOf[$ref:CustomFieldOptionsCreate, null]`
      describing the `{choices: [{label}]}` shape the wire actually accepts
      (typed under #805). Local is strictly more precise.

  - endpoint: "PATCH /custom_field_definitions/{id}"
    kind: type_diff
    field: options
    live: "object"
    local: "oneOf:[$ref:CustomFieldOptions]"
    category: intentional_local_divergence
    reason: >-
      Same shape as the POST variant: live declares a bare nullable `object`,
      local a typed `anyOf[$ref:CustomFieldOptions, null]` carrying the
      server-assigned choice `id`s. Local is strictly more precise.

  # --- manufacturing_order_productions: typed batch_transaction -------------
  - endpoint: "POST /manufacturing_order_productions"
    kind: type_diff
    field: batch_transaction
    live: "object"
    local: "$ref:ManufacturingOrderProductionBatchTransaction"
    category: intentional_local_divergence
    reason: >-
      Upstream inlines `CompletePartiallyBatchDto`, so this reads as a bare
      `object`; we name it so the generated clients get a real type. Field
      sets match (batch_id only). Originally #528 A1; retargeted from the
      shared $ref:BatchTransaction in #1042, which required a `quantity`
      this endpoint rejects.

  # --- sales_return_rows.quantity: upstream under-documents the type --------
  - endpoint: "POST /sales_return_rows"
    kind: type_diff
    field: quantity
    live: "?"
    local: "number"
    category: local_correct_upstream_wrong
    reason: >-
      Live leaves `quantity` untyped; we type it `number`. Every other quantity
      in the Katana wire contract is a number — upstream simply omits the type.
      Recommend Katana add `type: number` (#528 A4).

  - endpoint: "PATCH /sales_return_rows/{id}"
    kind: type_diff
    field: quantity
    live: "?"
    local: "number"
    category: local_correct_upstream_wrong
    reason: >-
      Same untyped-`quantity` omission as the POST variant. Recommend Katana
      add `type: number` (#528 A5).

  # --- bin_transfer_rows.quantity: upstream under-documents the type --------
  - endpoint: "POST /bin_transfer_rows"
    kind: type_diff
    field: quantity
    live: "?"
    local: "string"
    category: local_correct_upstream_wrong
    reason: >-
      Live declares `quantity` as an untyped anyOf(number|string) that the audit
      collapses to `?`. The bin-transfer wire contract returns quantities as
      fixed-precision decimal strings (e.g. `"3"` in the README.io response
      examples), so we type the request `string` to match. Recommend Katana
      declare `type: string`.

  - endpoint: "PATCH /bin_transfer_rows/{id}"
    kind: type_diff
    field: quantity
    live: "?"
    local: "string"
    category: local_correct_upstream_wrong
    reason: >-
      Same untyped-`quantity` omission as the POST variant. Local types it
      `string` to match the decimal-string wire contract.
  # ==========================================================================
  # Query-parameter drift (--params) and response-shape drift (--responses)
  # ==========================================================================
  # Kinds: param_only_local / param_only_live / param_type_diff / param_enum_diff
  # (field = wire param name; live/local = type signatures for the *_diff kinds),
  # and response_wrapper / response_empty_local / response_empty_both
  # (field = HTTP status code; live/local = "wrapped"/"bare" for response_wrapper).
  # The pagination/dateFilter scalar-expansion family is filtered structurally in
  # the audit (STRUCTURAL_PARAM_NAMES), not catalogued here.
  - endpoint: "GET /customer_addresses"
    kind: param_type_diff
    field: "entity_type"
    live: "string"
    local: "$ref:AddressEntityType"
    category: intentional_local_divergence
    reason: >-
      Local tightens the address entity_type filter to the typed
      AddressEntityType enum (billing/shipping, the values the create
      DTOs already use); the live gateway declares a bare string.

  - endpoint: "GET /materials"
    kind: param_type_diff
    field: "batch_tracked"
    live: "string"
    local: "enum:[false,true]"
    category: intentional_local_divergence
    reason: >-
      Local models the boolean batch_tracked filter as a stricter
      enum:[false,true]; upstream declares a bare string. The wire
      accepts ?batch_tracked=true (verified 2026-06-08). Local is more precise.

  - endpoint: "GET /products"
