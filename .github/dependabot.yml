# Dependabot configuration for automated dependency updates
# See:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Supported ecosystems:
# - uv: Python dependencies via pyproject.toml and uv.lock (GA since March 2025)
# - npm: TypeScript client deps via packages/katana-client/package-lock.json
#        (the lockfile CI gates with `npm ci` in the typescript-client job),
#        plus security updates only for the root pnpm workspace lockfile
#        (pnpm-lock.yaml), which also resolves packages/katana-client
# - github-actions: Workflow action versions
# - docker: Base images in Dockerfiles
#
# Note: Dependabot updates uv.lock but may not always update pyproject.toml version
# constraints. This is expected behavior - the lock file contains the actual pinned
# versions while pyproject.toml defines acceptable ranges.
# See: https://github.com/dependabot/dependabot-core/issues/12788
#
# Commit messages: every entry uses prefix `chore` with `include: scope`, which
# yields `chore(deps): bump ...` or `chore(deps-dev): bump ...`. Rebase merges
# land these commits on main as written, so they must pass the Conventional
# commits check (.github/workflows/commitlint.yml).

version: 2
updates:
  # Python dependencies (uv workspace - root and katana_mcp_server)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # Wait 7 days before proposing a bump to a newly published version, so a
    # freshly compromised or yanked release has time to surface before it lands.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    groups:
      # Group minor/patch updates to reduce PR noise
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Root pnpm workspace (pnpm-lock.yaml, `packageManager: pnpm@9.14.4`).
  # The workspace includes packages/katana-client, so this lockfile carries a
  # second resolution of the client's dependencies and GitHub raises security
  # alerts against it. `open-pull-requests-limit: 0` disables version updates
  # (the client's own entry below owns those, against the lockfile CI gates)
  # while security updates for this directory still run with this entry's
  # labels, commit message and ignore rules.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "typescript"
    ignore:
      # Same pin as the packages/katana-client entry below.
      - dependency-name: "@hey-api/openapi-ts"
    commit-message:
      prefix: "chore"
      include: "scope"

  # TypeScript client (npm — packages/katana-client/package-lock.json)
  # This is the lockfile CI installs from (`npm ci` in the typescript-client job).
  - package-ecosystem: "npm"
    directory: "/packages/katana-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "typescript"
    groups:
      # Group minor/patch updates to reduce PR noise
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @hey-api/openapi-ts is intentionally pinned to the `next` nightly: the
      # stable line (0.99.0) calls the TypeScript Compiler API (`ts.SyntaxKind`),
      # which tsgo removed, so it crashes `npm run generate` under TypeScript 7.
      # The v1 line (nightly-only today) dropped that dependency. Without this
      # ignore, Dependabot would "update" the locked nightly down to the 0.99.0
      # `latest` tag — a downgrade that re-breaks the TS 7 build. Remove this and
      # move the pin to ^1.0.0 once hey-api ships a stable v1
      # (check: `npm view @hey-api/openapi-ts dist-tags`).
      - dependency-name: "@hey-api/openapi-ts"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/katana_mcp_server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
      - "mcp-server"
    commit-message:
      prefix: "chore"
      include: "scope"
