# Dependabot configuration for automated dependency updates
# See:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Supported ecosystems:
# - uv: Python dependencies via pyproject.toml and uv.lock (GA since March 2025)
# - npm: TypeScript client deps via packages/katana-client/pnpm-lock.yaml. The
#        `npm` ecosystem covers pnpm lockfiles too; Dependabot runs the pnpm
#        version pinned by `packageManager` (CI installs with
#        `pnpm install --frozen-lockfile` in the typescript-client job).
# - github-actions: Workflow action versions
# - docker: Base images in Dockerfiles
#
# Note: Dependabot updates uv.lock but may not always update pyproject.toml version
# constraints. This is expected behavior - the lock file contains the actual pinned
# versions while pyproject.toml defines acceptable ranges.
# See: https://github.com/dependabot/dependabot-core/issues/12788
#
# Commit messages: every entry uses prefix `chore` with `include: scope`, which
# yields `chore(deps): bump ...` or `chore(deps-dev): bump ...`. Rebase merges
# land these commits on main as written, so they must pass the Conventional
# commits check (.github/workflows/commitlint.yml).

version: 2
updates:
  # Python dependencies (uv workspace - root and katana_mcp_server)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # Wait 7 days before proposing a bump to a newly published version, so a
    # freshly compromised or yanked release has time to surface before it lands.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    groups:
      # Group minor/patch updates to reduce PR noise
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # TypeScript client (pnpm — packages/katana-client/pnpm-lock.yaml, under the
  # `npm` ecosystem). This is the lockfile CI installs from
  # (`pnpm install --frozen-lockfile` in the typescript-client job). The browser
  # test bridge at katana_mcp_server/tests/browser/assets is deliberately NOT
  # listed: its exact pins must track the versions FastMCP expects, so bumps
  # there are manual and land with a rebuilt bridge.bundle.js.
  - package-ecosystem: "npm"
    directory: "/packages/katana-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "typescript"
    groups:
      # Group minor/patch updates to reduce PR noise
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # The TS client's isolated code generator (packages/katana-client/codegen,
  # its own pnpm lockfile). Stable @hey-api/openapi-ts calls the TypeScript
  # compiler API, which TypeScript 7 no longer exposes to JavaScript, so this
  # environment keeps TypeScript 6 while the client builds with 7. Bumps here
  # regenerate the client: CI's typescript-client job regenerates and
  # typechecks, so a generator update that breaks the client fails there.
  - package-ecosystem: "npm"
    directory: "/packages/katana-client/codegen"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "typescript"
    ignore:
      # TypeScript 7 removes the compiler API the generator calls. Lift this
      # once @hey-api/openapi-ts ships a stable release that no longer needs
      # it (the `next` line already dropped it; issue hey-api/hey-api#4235).
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/katana_mcp_server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
      - "mcp-server"
    commit-message:
      prefix: "chore"
      include: "scope"
