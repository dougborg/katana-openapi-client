name: Commit conventions

# Rebase merges land every commit of a pull request on main as written, and
# release-please reads each one to pick version bumps and write the changelog.
# So every commit in the pull request must be a Conventional Commit, not only
# the PR title. Rules live in .commitlintrc.json; the type list matches the
# changelog-sections in release-please-config.json.

on:
  pull_request:

permissions: {}

jobs:
  lint-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Lint every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          npx --yes --package=@commitlint/cli@21.2.3
          --package=@commitlint/config-conventional@21.2.3
          -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
