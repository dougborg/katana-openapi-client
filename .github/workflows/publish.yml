name: Publish

# The only workflow that builds and ships artifacts. Triggered exclusively
# by the tags release-please creates when its release PR merges
# (client-v*, mcp-v*). Nothing here ever pushes to main.
#
# release-please creates each GitHub Release as a DRAFT (see
# release-please-config.json "draft": true). Draft releases accept asset
# uploads; once published they become immutable and reject further uploads
# (https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases).
# So every publish job builds its assets, publishes to the registry, THEN
# uploads assets to the still-draft release, and only then flips it to
# published - assets and registry publish always land before the release is
# finalized.

on:
  push:
    tags:
      - 'client-v*'
      - 'mcp-v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-client-pypi:
    name: Publish client to PyPI
    if: startsWith(github.ref_name, 'client-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # No dependency cache in the release build - a poisoned cache could
          # contaminate the published artifact (zizmor: cache-poisoning).
          enable-cache: false
          python-version: "3.14"

      - name: Build client package
        run: uv build

      - name: Publish client to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 (v1.14.0)
        with:
          attestations: true

      - name: Attach build artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass via env rather than inline ${{ }} in the run block
          # (zizmor: template-injection).
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Publish the (now immutable) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  publish-mcp-pypi:
    name: Publish MCP server to PyPI
    if: startsWith(github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # No dependency cache in the release build - a poisoned cache could
          # contaminate the published artifact (zizmor: cache-poisoning).
          enable-cache: false
          python-version: "3.14"

      - name: Build MCP package
        # katana_mcp_server is a uv workspace member (see [tool.uv.workspace]
        # in the root pyproject.toml), so `uv build` for it writes to the
        # WORKSPACE ROOT's dist/, not katana_mcp_server/dist/ - this matches
        # how the old release.yml already relied on it (its upload-artifact
        # step used a bare `dist/` path after `cd katana_mcp_server && uv
        # build`). Building via --package from the repo root makes that
        # explicit instead of relying on the `cd` side effect.
        run: uv build --package katana-mcp-server

      - name: Publish MCP server to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 (v1.14.0)
        with:
          attestations: true

      - name: Attach build artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass via env rather than inline ${{ }} in the run block
          # (zizmor: template-injection).
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Publish the (now immutable) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  publish-mcp-docker:
    name: Publish MCP Docker Image
    needs: publish-mcp-pypi
    if: startsWith(github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Determine MCP version for tagging
        id: version
        run: echo "mcp_version=${GITHUB_REF_NAME#mcp-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/katana-mcp-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.mcp_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.mcp_version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.mcp_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./katana_mcp_server
          file: ./katana_mcp_server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
