name: Publish

# The only workflow that builds and ships artifacts. Triggered exclusively
# by the tags release-please creates when its release PR merges
# (client-v*, mcp-v*, ts-v*). Nothing here ever pushes to main.
#
# release-please creates each GitHub Release as a DRAFT (see
# release-please-config.json "draft": true). Draft releases accept asset
# uploads; once published they become immutable and reject further uploads
# (https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases).
# So every publish job builds its assets, publishes to the registry, THEN
# uploads assets to the still-draft release, and only then flips it to
# published - assets and registry publish always land before the release is
# finalized.

on:
  push:
    tags:
      - 'client-v*'
      - 'mcp-v*'
      - 'ts-v*'
  # Recovery path only. A tag push runs the workflow file AS OF THAT TAG, so a
  # bug fixed in publish.yml on main cannot be picked up by re-running the
  # failed tag run. Dispatching from main with the existing tag runs main's
  # workflow against that tag's commit instead. Tags are never moved.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. ts-v0.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish-client-pypi:
    name: Publish client to PyPI
    if: startsWith(inputs.tag || github.ref_name, 'client-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No dependency cache in the release build - a poisoned cache could
          # contaminate the published artifact (zizmor: cache-poisoning).
          enable-cache: false
          python-version: "3.14"

      - name: Build client package
        run: uv build

      - name: Publish client to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.0)
        with:
          attestations: true

      - name: Attach artifacts and publish the release
        uses: ./.github/actions/finalize-draft-release
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          assets: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-pypi:
    name: Publish MCP server to PyPI
    if: startsWith(inputs.tag || github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No dependency cache in the release build - a poisoned cache could
          # contaminate the published artifact (zizmor: cache-poisoning).
          enable-cache: false
          python-version: "3.14"

      - name: Build MCP package
        # katana_mcp_server is a uv workspace member (see [tool.uv.workspace]
        # in the root pyproject.toml), so `uv build` for it writes to the
        # WORKSPACE ROOT's dist/, not katana_mcp_server/dist/ - this matches
        # how the old release.yml already relied on it (its upload-artifact
        # step used a bare `dist/` path after `cd katana_mcp_server && uv
        # build`). Building via --package from the repo root makes that
        # explicit instead of relying on the `cd` side effect.
        run: uv build --package katana-mcp-server

      - name: Publish MCP server to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.0)
        with:
          attestations: true

      - name: Attach artifacts and publish the release
        uses: ./.github/actions/finalize-draft-release
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          assets: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-ts-npm:
    name: Publish TypeScript client to npm
    if: startsWith(inputs.tag || github.ref_name, 'ts-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: packages/katana-client
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup pnpm
        # The pnpm version comes from `packageManager` in the package's
        # package.json, the same pin CI and contributors use.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/katana-client/package.json

      - name: Setup Node
        # No dependency cache in the release build - a poisoned cache could
        # contaminate the published artifact (zizmor: cache-poisoning). No
        # registry-url either: that writes an .npmrc token placeholder, and
        # auth here is npm Trusted Publishing (OIDC), not a token.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        # CI already gated the PR, but an npm publish is irrevocable, so re-prove
        # the tagged commit here (this also re-runs the GHSA-hhx9-57xq-r5rw
        # regression test on the exact code being shipped).
        run: |
          pnpm run typecheck
          pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack the release tarball
        # Pack exactly once. The same tarball is published to npm and attached
        # to the GitHub release, so the two can never drift.
        run: pnpm pack --pack-destination ../../dist

      - name: Check whether this version is already on npm
        # npm never allows re-publishing a version, so a re-run of this workflow
        # after a failure in a LATER step (release upload / un-draft) must skip
        # the publish instead of dying on E403/EPUBLISHCONFLICT. A 404 here means
        # the version (or, before the first bootstrap publish, the package) does
        # not exist yet - that is the normal "go ahead and publish" case.
        id: npm-check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if out="$(pnpm view "katana-openapi-client@${VERSION}" version 2>&1)"; then
            echo "katana-openapi-client@${VERSION} is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq "E404|ERR_PNPM_PACKAGE_NOT_FOUND|No matching version" <<< "$out"; then
            # Not published yet. pnpm's native view reports a missing version of
            # an existing package as ERR_PNPM_PACKAGE_NOT_FOUND / "No matching
            # version"; a package that does not exist at all (pre-bootstrap) is
            # the registry's E404.
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            # Anything else (registry outage, DNS, auth) must not be mistaken
            # for "not published" - surface it and stop.
            echo "$out"
            exit 1
          fi

      - name: Publish to npm via Trusted Publishing
        if: steps.npm-check.outputs.published != 'true'
        # pnpm 11 publishes natively (no npm CLI delegation) and performs the
        # OIDC exchange with registry.npmjs.org itself when running on GitHub
        # Actions with id-token: write; no NPM_TOKEN exists. --provenance
        # attaches the build attestation. --no-git-checks is belt-and-braces:
        # pnpm skips git checks for a tarball argument anyway, but a tag checkout
        # is a detached HEAD, so the flag keeps this correct if the step ever
        # switches to publishing the directory instead.
        run: pnpm publish ../../dist/*.tgz --access public --provenance --no-git-checks

      - name: Attach artifacts and publish the release
        uses: ./.github/actions/finalize-draft-release
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          assets: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-docker:
    name: Publish MCP Docker Image
    needs: publish-mcp-pypi
    if: startsWith(inputs.tag || github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Determine MCP version for tagging
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "mcp_version=${RELEASE_TAG#mcp-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/katana-mcp-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.mcp_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.mcp_version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.mcp_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build both workspace packages from this release commit. The client and
          # MCP tags are published by separate workflow runs, so resolving the
          # client from PyPI here can race its upload.
          context: .
          file: ./katana_mcp_server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
