name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "katana_public_api_client/**"
      - ".github/workflows/docs.yml"
      - "overrides/**"
      - "scripts/site_analytics.mjs"
      - "scripts/site-analytics.json"
  # Pull requests build and check the tracked site but never deploy it.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "katana_public_api_client/**"
      - ".github/workflows/docs.yml"
      - "overrides/**"
      - "scripts/site_analytics.mjs"
      - "scripts/site-analytics.json"
  workflow_dispatch:

# Least privilege at the workflow level; jobs opt into the scopes they need.
permissions: {}

# Allow only one concurrent deployment; pull request runs never deploy and get
# their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare visitor analytics
        # Fetches the pinned @dougborg/site-analytics, checks its integrity, and
        # writes the config element and module file; overrides/main.html adds the
        # module tag. See scripts/site_analytics.mjs.
        run: node scripts/site_analytics.mjs prepare

      - name: Build documentation
        run: uv run poe docs-build
        env:
          CI_DOCS_BUILD: "true"
          # Silences the Material-team "MkDocs 2.0" prep-banner.
          NO_MKDOCS_2_WARNING: "true"
          # Silences the properdocs promotional banner.
          DISABLE_MKDOCS_2_WARNING: "true"

      - name: Check every page is tracked and links the privacy page
        run: node scripts/site_analytics.mjs check site

      - name: Upload documentation artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
