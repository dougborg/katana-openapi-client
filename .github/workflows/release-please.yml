name: Release Please

# The only workflow that watches pushes to main for release purposes. It
# never pushes to main itself - it only opens/updates the aggregated release
# PR (release-please-config.json / .release-please-manifest.json at the repo
# root), or, once that PR has been merged, creates the client-v*/mcp-v* tags
# and draft GitHub Releases at the merge commit. See docs/RELEASE.md.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release tag helper
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Creating a draft release does not create its Git ref. The App token
      # ensures these tag pushes trigger publish.yml (GITHUB_TOKEN would not).
      - name: Create tags for draft releases
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: python3 scripts/ensure_release_tags.py
